<script>
(function () {
  var stage = document.getElementById('stage');
  var vp = document.getElementById('viewport');
  var CW = 1600, CH = 1080;
  var scale = 1, tx = 0, ty = 0, minScale = 0.1, maxScale = 12;

  function apply() { vp.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function fit() {
    var pad = 48;
    var s = Math.min((window.innerWidth - 2 * pad) / CW, (window.innerHeight - 2 * pad) / CH);
    scale = s;
    tx = (window.innerWidth - CW * s) / 2;
    ty = (window.innerHeight - CH * s) / 2;
    apply();
  }

  function zoomAt(cx, cy, factor) {
    var ns = clamp(scale * factor, minScale, maxScale);
    if (ns === scale) return;
    tx = cx - (cx - tx) * (ns / scale);
    ty = cy - (cy - ty) * (ns / scale);
    scale = ns;
    apply();
  }

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1 / 1.12);
  }, { passive: false });

  var dragging = false, lastX = 0, lastY = 0;
  stage.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    stage.classList.add('grabbing'); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    tx += e.clientX - lastX; ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY; apply();
  });
  function endDrag() { dragging = false; stage.classList.remove('grabbing'); }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  document.getElementById('zin').onclick = function () { var r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.25); };
  document.getElementById('zout').onclick = function () { var r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.25); };
  document.getElementById('reset').onclick = fit;
  document.getElementById('full').onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  };

  window.addEventListener('resize', fit);
  fit();
})();
</script>
